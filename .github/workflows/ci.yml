# HealthQueue CI/CD pipeline
#
#   test ─┐
#         ├─> build → scan → SBOM → push → sign → attest ─┬─> SLSA provenance ─> gitops-bump
#   scan-source ┘                                         └──────────────────────┘
#
# Pull requests run everything up to (and including) the image scan + SBOM, but never push or sign.
# Pushes to main additionally publish, sign, attest, and bump the Kubernetes manifest for Argo CD.
#
# All third-party actions are pinned to full commit SHAs (tag shown in the comment) so a moved or
# hijacked tag cannot inject code into the pipeline. Dependabot keeps these pins up to date.

name: ci

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read # least privilege by default; jobs elevate only what they need

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -v --junitxml=reports/junit.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-results
          path: reports/

  scan-source:
    name: Source scan (deps, secrets, IaC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Scans requirements files for vulnerable deps, the repo for committed secrets,
      # and Dockerfile / Kubernetes / OpenTofu files for misconfigurations.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  build:
    name: Build, scan, SBOM, sign
    needs: [test, scan-source]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # push to ghcr.io
      id-token: write        # keyless cosign signing via GitHub OIDC
      security-events: write # upload Trivy SARIF to the Security tab
    outputs:
      image: ${{ steps.vars.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute image name (GHCR requires lowercase)
        id: vars
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.vars.outputs.image }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      # 1) Build locally first so the image can be scanned BEFORE it is published.
      - name: Build (local, for scanning)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: healthqueue-api:ci
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 2) Security gate: fail on any HIGH/CRITICAL vulnerability that has a fix available.
      - name: Trivy image scan (gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: healthqueue-api:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Trivy image scan (SARIF report, all severities)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: healthqueue-api:ci
          format: sarif
          output: trivy-image.sarif
          skip-setup-trivy: true

      - name: Upload SARIF to GitHub Security tab
        if: always()
        continue-on-error: true # code scanning needs a public repo (or GitHub Advanced Security)
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-image.sarif

      # 3) SBOM: SPDX (attached to the image) + CycloneDX (for tooling that prefers it).
      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: healthqueue-api:ci
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: healthqueue-api:ci
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.*.json

      # ---------- Everything below only runs on main ----------
      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4) Push. Same inputs + warm cache => the scanned layers are the ones published.
      - name: Push image
        id: push
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          provenance: false # SLSA provenance is produced by the dedicated SLSA job below
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: env.PUBLISH == 'true'

      # 5) Keyless signing: no long-lived keys. The workflow's OIDC identity is bound into a
      #    short-lived Fulcio certificate and the signature is logged in the Rekor transparency log.
      - name: Sign image (cosign keyless)
        if: env.PUBLISH == 'true'
        env:
          REF: ${{ steps.vars.outputs.image }}@${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$REF"

      # 6) Attach the SBOM to the image as a signed in-toto attestation.
      - name: Attest SBOM
        if: env.PUBLISH == 'true'
        env:
          REF: ${{ steps.vars.outputs.image }}@${{ steps.push.outputs.digest }}
        run: cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$REF"

      # 7) Prove it: verify signature + SBOM attestation against the expected workflow identity.
      - name: Verify signature and SBOM attestation
        if: env.PUBLISH == 'true'
        env:
          REF: ${{ steps.vars.outputs.image }}@${{ steps.push.outputs.digest }}
          IDENTITY: https://github.com/${{ github.workflow_ref }}
        run: |
          IDENTITY="${IDENTITY%@*}@refs/heads/main"
          cosign verify "$REF" \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          cosign verify-attestation "$REF" --type spdxjson \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          echo "Signature and SBOM attestation verified for $REF" >> "$GITHUB_STEP_SUMMARY"

  # 8) SLSA Build L3 provenance, generated in an isolated reusable workflow the build job cannot
  #    tamper with. (The SLSA generator must be referenced by tag, not SHA - it verifies its own ref.)
  provenance:
    name: SLSA provenance
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      actions: read
      id-token: write
      packages: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
    with:
      image: ${{ needs.build.outputs.image }}
      digest: ${{ needs.build.outputs.digest }}
      registry-username: ${{ github.actor }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  # 9) Continuous delivery via GitOps: update the desired state in Git; Argo CD does the deploy.
  #    The image is referenced by immutable digest, never by a mutable tag.
  gitops-bump:
    name: Update Kubernetes manifest (GitOps)
    needs: [build, provenance]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set image digest in kustomization
        env:
          NEW_IMAGE: ${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}
        run: |
          if [ ! -f k8s/kustomization.yaml ]; then
            echo "k8s/kustomization.yaml not present yet - skipping GitOps bump" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cd k8s && kustomize edit set image "healthqueue-api=$NEW_IMAGE" && cd ..
          if git diff --quiet; then echo "No change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy: healthqueue-api ${GITHUB_SHA::7} [skip ci]"
          git push
