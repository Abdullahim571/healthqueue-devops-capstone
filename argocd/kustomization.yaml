# Lean Argo CD install for the local "healthqueue" kind cluster.
#   kubectl --context kind-healthqueue apply --server-side --force-conflicts -k argocd/
#
# Upstream install pinned to the COMMIT behind the v3.5.6 release tag (tags can be moved; a commit
# SHA can't), then trimmed to fit a small Docker Desktop VM:
#   - dex (SSO), notifications and ApplicationSet controllers are scaled to 0 (not needed here)
#   - the remaining components get memory requests/limits so they cannot starve other clusters
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd

resources:
  - namespace.yaml
  # v3.5.6 = c2b1e3017e2cec86b122172e861dcd026453ae44. To upgrade, resolve the new tag's commit:
  #   curl -s https://api.github.com/repos/argoproj/argo-cd/commits/<tag> | jq -r .sha
  - https://raw.githubusercontent.com/argoproj/argo-cd/c2b1e3017e2cec86b122172e861dcd026453ae44/manifests/install.yaml

patches:
  - target: {kind: Deployment, name: argocd-dex-server}
    patch: &off |-
      - op: replace
        path: /spec/replicas
        value: 0
  - target: {kind: Deployment, name: argocd-notifications-controller}
    patch: *off
  - target: {kind: Deployment, name: argocd-applicationset-controller}
    patch: *off

  - target: {kind: StatefulSet, name: argocd-application-controller}
    patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata: {name: argocd-application-controller}
      spec:
        template:
          spec:
            containers:
              - name: argocd-application-controller
                resources:
                  requests: {cpu: 100m, memory: 192Mi}
                  limits: {memory: 512Mi}
  - target: {kind: Deployment, name: argocd-repo-server}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: argocd-repo-server}
      spec:
        template:
          spec:
            containers:
              - name: argocd-repo-server
                resources:
                  requests: {cpu: 50m, memory: 96Mi}
                  limits: {memory: 256Mi}
  - target: {kind: Deployment, name: argocd-server}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: argocd-server}
      spec:
        template:
          spec:
            containers:
              - name: argocd-server
                resources:
                  requests: {cpu: 50m, memory: 64Mi}
                  limits: {memory: 256Mi}
  - target: {kind: Deployment, name: argocd-redis}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: argocd-redis}
      spec:
        template:
          spec:
            containers:
              - name: redis
                resources:
                  requests: {cpu: 20m, memory: 32Mi}
                  limits: {memory: 128Mi}
