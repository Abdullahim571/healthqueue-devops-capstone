apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthqueue-api
  labels:
    app.kubernetes.io/name: healthqueue-api
spec:
  # One replica: appointments live in process memory (app/store.py), so extra
  # replicas would each hold different data. Scale out once a shared database exists.
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: healthqueue-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: healthqueue-api
    spec:
      automountServiceAccountToken: false # the API never talks to Kubernetes
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001 # matches USER in the Dockerfile
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # Placeholder name; kustomization.yaml rewrites it to the GHCR image pinned by digest.
          image: healthqueue-api
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 192Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
