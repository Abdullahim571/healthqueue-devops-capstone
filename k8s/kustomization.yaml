# Desired state of the HealthQueue API, synced to the cluster by Argo CD.
# CI (gitops-bump job) updates the image digest below after each signed build on main.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: healthqueue

labels:
- pairs:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: healthqueue

resources:
- namespace.yaml
- deployment.yaml
- service.yaml
- networkpolicy.yaml

images:
- digest: sha256:af2cf991bb3bc0b570657b79423cd4249f2d3b8be9773de6293dc3abccbc1f4b
  name: healthqueue-api
  newName: ghcr.io/abdullahim571/healthqueue-devops-capstone
